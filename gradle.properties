org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The project has no AndroidX or Kotlin dependencies at all: it is plain Java on the
# platform APIs. These two options keep AGP from injecting an unused Kotlin runtime
# (and the AndroidX runtime) into the classpath.
android.useAndroidX=false
android.builtInKotlin=false
android.nonTransitiveRClass=true

# The deprecation notice for the two options above is expected and harmless.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
