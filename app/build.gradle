plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vulndroid.app'
    compileSdk 37

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    buildFeatures {
        buildConfig true
        // The two flavors ship different launcher labels via resValue.
        resValues true
    }

    flavorDimensions "mode"

    productFlavors {
        vuln {
            dimension "mode"
            applicationId "com.vulndroid.app"
            resValue "string", "app_name", "VulnDroid"
            buildConfigField "boolean", "VULNERABLE_BUILD", "true"
        }
        secure {
            dimension "mode"
            applicationId "com.vulndroid.app.secure"
            resValue "string", "app_name", "VulnDroid Secure"
            buildConfigField "boolean", "VULNERABLE_BUILD", "false"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
